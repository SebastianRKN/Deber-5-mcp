name: Verificacion Deber 5 MCP

on:
  push:
    branches: [deber5]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas pytest
        run: python -m pytest mcp-detective -q
      - name: Probar MCP stdio, D1-D7 y reinicio
        run: python mcp-detective/verificar_mcp.py
